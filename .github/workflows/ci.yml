name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pure-modules:
    name: Pure modules (Linux, swift test)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Build pure targets
        working-directory: Packages
        run: swift build
      - name: Run tests
        working-directory: Packages
        run: swift test --parallel

  app:
    name: App (Xcode, iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Build for simulator
        run: |
          xcodebuild -project Care.xcodeproj -scheme Care \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          echo "===== COMPILER ERRORS ====="
          grep -E "error:" build.log | sed 's|/Users/runner/work/care/care/||' | sort -u | head -40 || true
          echo "===== END ERRORS ====="
          grep -q "BUILD SUCCEEDED" build.log
