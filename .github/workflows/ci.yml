name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pure-modules:
    name: Pure modules (Linux, swift test)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Build pure targets
        working-directory: Packages
        run: swift build
      - name: Run tests
        working-directory: Packages
        run: swift test --parallel

  app:
    name: App (Xcode, iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check that every cross-module import is declared
        run: python3 scripts/check-imports.py
      - name: Select the newest Xcode on the runner
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Build for simulator
        run: |
          # Explicit module builds, because that is what Xcode 27 does by default. Without this the
          # runner's older Xcode resolves undeclared imports through implicit module search paths and
          # a build that is green here fails on a current Mac.
          xcodebuild -project Care.xcodeproj -scheme Care \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=YES \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          echo "===== COMPILER ERRORS ====="
          grep -E "error:" build.log | sed 's|/Users/runner/work/care/care/||' | sort -u | head -40 || true
          echo "===== END ERRORS ====="
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build for a device
        run: |
          # The simulator build alone does not prove the app compiles for iPhone hardware. Signing is
          # the one thing a runner cannot do, so that is all this skips.
          xcodebuild -project Care.xcodeproj -scheme Care \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            SWIFT_ENABLE_EXPLICIT_MODULES=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > device.log 2>&1 || true
          echo "===== DEVICE BUILD ERRORS ====="
          grep -E "error:" device.log | sed 's|/Users/runner/work/care/care/||' | sort -u | head -40 || true
          echo "===== END ERRORS ====="
          grep -q "BUILD SUCCEEDED" device.log
