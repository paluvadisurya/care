<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#111}
  .wrap{display:flex;gap:40px;padding:40px}
  svg{display:block}
</style></head>
<body>
<div class="wrap">
<!-- Light / default: glossy heart orb with two rings of light on a full-bleed coral to rose gradient -->
<svg id="light" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset="0.45" stop-color="#FF5A6E"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.28" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#FFD5B8" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#FF7A6B" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5B3BD6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.36" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#FFE9E0"/>
      <stop offset="0.22" stop-color="#FF9E8A"/>
      <stop offset="0.6" stop-color="#FF4F7B"/>
      <stop offset="1" stop-color="#B8347F"/>
    </radialGradient>
    <radialGradient id="orbShade" cx="0.5" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#4C1358" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#4C1358" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFD9C9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <clipPath id="square"><rect width="1024" height="1024"/></clipPath>
    <!-- Heart path centred on 512,512, about 560 wide -->
    <path id="heart" d="M512 792 C 470 760, 240 620, 240 440 C 240 340, 320 280, 400 280 C 452 280, 492 308, 512 348 C 532 308, 572 280, 624 280 C 704 280, 784 340, 784 440 C 784 620, 554 760, 512 792 Z"/>
  </defs>
  <g clip-path="url(#square)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#bgGlow)"/>
    <!-- halo rings -->
    <g fill="none" stroke-linecap="round">
      <ellipse cx="512" cy="560" rx="392" ry="150" stroke="url(#ring)" stroke-width="10" transform="rotate(-22 512 560)" opacity="0.9" filter="url(#tiny)"/>
      <ellipse cx="512" cy="560" rx="392" ry="150" stroke="#FFFFFF" stroke-width="26" transform="rotate(-22 512 560)" opacity="0.28" filter="url(#soft)"/>
      <ellipse cx="516" cy="540" rx="440" ry="120" stroke="url(#ring)" stroke-width="7" transform="rotate(18 516 540)" opacity="0.75" filter="url(#tiny)"/>
      <ellipse cx="516" cy="540" rx="440" ry="120" stroke="#FFFFFF" stroke-width="22" transform="rotate(18 516 540)" opacity="0.2" filter="url(#soft)"/>
    </g>
    <!-- drop shadow and glow under the orb -->
    <use href="#heart" fill="#3A0F4E" opacity="0.5" transform="translate(0 46)" filter="url(#shadow)"/>
    <use href="#heart" fill="#FF6B57" opacity="0.55" transform="translate(0 20) scale(1.04) translate(-20 -20)" filter="url(#softer)"/>
    <!-- orb body -->
    <g transform="translate(512 528) scale(1.08) translate(-512 -528)">
    <use href="#heart" fill="url(#orb)"/>
    <use href="#heart" fill="url(#orbShade)"/>
    <use href="#heart" fill="none" stroke="url(#rim)" stroke-width="6"/>
    <ellipse cx="410" cy="378" rx="96" ry="58" fill="url(#spec)" transform="rotate(-24 410 378)"/>
    <ellipse cx="372" cy="352" rx="30" ry="18" fill="#FFFFFF" opacity="0.95" transform="rotate(-24 372 352)"/>
    <ellipse cx="650" cy="640" rx="60" ry="26" fill="#FFFFFF" opacity="0.14" transform="rotate(30 650 640)"/>
    </g>
    <!-- ring passing in front of the orb -->
    <path d="M 132 640 C 260 760, 700 790, 892 662" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" opacity="0.95" filter="url(#tiny)"/>
    <path d="M 132 640 C 260 760, 700 790, 892 662" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.25" filter="url(#soft)"/>
    <!-- sparkle -->
    <g fill="#FFFFFF" opacity="0.95">
      <path d="M 740 236 L 752 272 L 788 284 L 752 296 L 740 332 L 728 296 L 692 284 L 728 272 Z"/>
      <circle cx="812" cy="212" r="7"/>
    </g>
  </g>
</svg>

<!-- Dark: deep plum background, same hero -->
<svg id="dark" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1030"/>
      <stop offset="0.55" stop-color="#160B1E"/>
      <stop offset="1" stop-color="#0C0B12"/>
    </linearGradient>
    <radialGradient id="dglow" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#FF4F8B" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0C0B12" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#square)">
    <rect width="1024" height="1024" fill="url(#dbg)"/>
    <rect width="1024" height="1024" fill="url(#dglow)"/>
    <g fill="none" stroke-linecap="round">
      <ellipse cx="512" cy="560" rx="392" ry="150" stroke="url(#ring)" stroke-width="10" transform="rotate(-22 512 560)" opacity="0.9" filter="url(#tiny)"/>
      <ellipse cx="512" cy="560" rx="392" ry="150" stroke="#FFB4C8" stroke-width="26" transform="rotate(-22 512 560)" opacity="0.28" filter="url(#soft)"/>
      <ellipse cx="516" cy="540" rx="440" ry="120" stroke="url(#ring)" stroke-width="7" transform="rotate(18 516 540)" opacity="0.75" filter="url(#tiny)"/>
      <ellipse cx="516" cy="540" rx="440" ry="120" stroke="#C4B5FD" stroke-width="22" transform="rotate(18 516 540)" opacity="0.2" filter="url(#soft)"/>
    </g>
    <use href="#heart" fill="#000" opacity="0.6" transform="translate(0 46)" filter="url(#shadow)"/>
    <use href="#heart" fill="#FF4F8B" opacity="0.6" transform="translate(0 20) scale(1.04) translate(-20 -20)" filter="url(#softer)"/>
    <g transform="translate(512 528) scale(1.08) translate(-512 -528)">
    <use href="#heart" fill="url(#orb)"/>
    <use href="#heart" fill="url(#orbShade)"/>
    <use href="#heart" fill="none" stroke="url(#rim)" stroke-width="6"/>
    <ellipse cx="410" cy="378" rx="96" ry="58" fill="url(#spec)" transform="rotate(-24 410 378)"/>
    <ellipse cx="372" cy="352" rx="30" ry="18" fill="#FFFFFF" opacity="0.95" transform="rotate(-24 372 352)"/>
    <ellipse cx="650" cy="640" rx="60" ry="26" fill="#FFFFFF" opacity="0.14" transform="rotate(30 650 640)"/>
    </g>
    <path d="M 132 640 C 260 760, 700 790, 892 662" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round" opacity="0.95" filter="url(#tiny)"/>
    <path d="M 132 640 C 260 760, 700 790, 892 662" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.22" filter="url(#soft)"/>
    <g fill="#FFFFFF" opacity="0.95">
      <path d="M 740 236 L 752 272 L 788 284 L 752 296 L 740 332 L 728 296 L 692 284 L 728 272 Z"/>
      <circle cx="812" cy="212" r="7"/>
    </g>
  </g>
</svg>

<!-- Tinted: grayscale on transparent, the system applies the colour -->
<svg id="tinted" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="torb" cx="0.36" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#D8D8D8"/>
      <stop offset="1" stop-color="#6E6E6E"/>
    </radialGradient>
  </defs>
  <g>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <ellipse cx="512" cy="560" rx="392" ry="150" stroke-width="12" transform="rotate(-22 512 560)" opacity="0.8"/>
      <ellipse cx="516" cy="540" rx="440" ry="120" stroke-width="8" transform="rotate(18 516 540)" opacity="0.6"/>
    </g>
    <use href="#heart" fill="url(#torb)"/>
    <ellipse cx="372" cy="352" rx="34" ry="20" fill="#FFFFFF" transform="rotate(-24 372 352)"/>
    <path d="M 132 640 C 260 760, 700 790, 892 662" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
</div>
</body></html>
